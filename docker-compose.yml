services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wcc
      POSTGRES_PASSWORD: wcc
      POSTGRES_DB: webhook_control_center
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wcc -d webhook_control_center"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://wcc:wcc@postgres:5432/webhook_control_center?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: docker-development-secret-with-more-than-32-characters
      API_PORT: 4000
      WEB_ORIGIN: http://localhost:5173
      NODE_ENV: production
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "pnpm db:deploy && pnpm db:seed && pnpm --filter @wcc/api start"

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://wcc:wcc@postgres:5432/webhook_control_center?schema=public
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    command: pnpm --filter @wcc/worker start

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:4000
    environment:
      VITE_API_URL: http://localhost:4000
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_started
    command: pnpm --filter @wcc/web preview

volumes:
  postgres-data:
